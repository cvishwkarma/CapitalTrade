version: 0.2

phases:

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGION=$AWS_DEFAULT_REGION
      - ECR_URI=$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/capitaltrade
      - echo "ECR URI is $ECR_URI"
      - aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_URI

  build:
    commands:
      - echo "Build started on `date`"

      - echo "Restoring .NET solution..."
      - dotnet restore CapitalTrade.slnx

      - echo "Building solution..."
      - dotnet build CapitalTrade.slnx --configuration Release --no-restore

      - echo "Running tests..."
      - dotnet test CapitalTrade.slnx --configuration Release --no-build

      - echo "Building Docker image..."
      - docker build -t $ECR_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION ./src/CapitalTrade.OrderService

  post_build:
    commands:
      - echo "Pushing Docker image to ECR..."
      - docker push $ECR_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION

      - echo "Tagging image as latest..."
      - docker tag $ECR_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION $ECR_URI:latest

      - echo "Pushing latest image..."
      - docker push $ECR_URI:latest

      - echo "Build completed on `date`"

artifacts:
  files:
    - buildspec.yml